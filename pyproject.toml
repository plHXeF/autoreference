[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autoreference"
version = "0.1.0a0"
description = "Find, assess, and export possible scholarly citations for a claim."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AutoReference contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.68,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
zhizhen = ["selenium>=4.28,<5"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
autoreference = "autoreference.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["autoreference"]

[tool.hatch.build]
include = ["autoreference/**/*.py", "autoreference/static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

