[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autoreference"
version = "0.2.0a0"
description = "Find, assess, and export possible scholarly citations for a claim."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "AutoReference contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "bibtexparser>=1.4.3,<2",
  "pylatexenc>=2.10,<3",
  "defusedxml>=0.7,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "typer>=0.15,<1",
]

[project.urls]
Repository = "https://github.com/plHXeF/autoreference"
Issues = "https://github.com/plHXeF/autoreference/issues"

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]
llm = ["openai>=1.68,<3"]
zhizhen = ["selenium>=4.28,<5"]
dev = [
  "pytest>=8.3,<9",
  "PyYAML>=6,<7",
  "fastapi>=0.115,<1",
  "openai>=1.68,<3",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
autoreference = "autoreference.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autoreference"]

[tool.hatch.build]
include = ["src/autoreference/**/*.py", "src/autoreference/static/*"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "skills", "scripts", "docs", "README.md", "LICENSE", "pyproject.toml", ".env.example"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

